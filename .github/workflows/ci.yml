name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Run tests
        run: uv run --python 3.12 --with pytest --with jsonschema --with matplotlib --with ruff pytest tests/ -v
      - name: Lint
        run: uv run --python 3.12 --with ruff ruff check .
